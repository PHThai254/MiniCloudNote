events {
    worker_connections 1024;
}

http {
    # === 1. Cấu hình RATE LIMIT (CHỐNG SPAM) ===
    # Định nghĩa vùng nhớ tên là 'mylimit', kích thước 10MB
    # Giới hạn: Mỗi IP ($binary_remote_addr) chỉ được gửi tối đa 5 request/giây
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;

    # === 2. CẤU HÌNH CACHE (BỘ NHỚ ĐỆM) ===
    # Tạo thư mục cache tại /var/cache/nginx/my_cache
    # max_size=1g: Tối đa 1GB. inactive=60m: Dữ liệu không ai xem trong 60p sẽ bị xóa.
    proxy_cache_path /var/cache/nginx/my_cache levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream backend_api {
        server api:8080;
    }

    # SERVER 1: Chuyển hướng HTTP -> HTTPS
    server {
        listen 80;
        server_name minicloud.local;
        # Lệnh chuyển hướng vĩnh viễn (301) sang HTTPS
        return 301 https://$host$request_uri;
    }

    # SERVER 2: Xử lý HTTPS
    server {
        listen 443 ssl; # Lắng nghe cổng 443 có SSL
        server_name minicloud.local;

        # Chỉ đường dẫn đến file chứng chỉ (Đường dẫn TRONG container)
        ssl_certificate /etc/nginx/certs/minicloud.crt;
        ssl_certificate_key /etc/nginx/certs/minicloud.key;

        # Cấu hình SSL chuẩn (Tùy chọn để tăng bảo mật)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers "HIGH:!aNULL:!MD5";
        
        location / {
            # Áp dụng chống Spam
            # burst=10: Cho phép "nợ" tối đa 10 request (tăng đột biến)
            # nodelay: Xử lý ngay lập tức, không bắt chờ (nếu quá burst thì chặn luôn)
            limit_req zone=mylimit burst=10 nodelay;

            # ÁP dụng Cache
            proxy_cache my_cache;
            # Chỉ cache những request GET trả về 200 (Thành công) trong 10 phút
            proxy_cache_valid 200 10m;
            # Cache lỗi 404 trong 1 phút 
            proxy_cache_valid 404 1m;

            # Thêm Header để chúng ta biết request có được cache hay không (HIT/MISS)
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://backend_api;

            # Header quan trọng để Backend biết request đến từ HTTPS
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # Báo là https
        }
    }
}
