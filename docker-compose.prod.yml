services:
  # 1. Database (PostgreSQL)
  postgres:
    image: postgres:15
    container_name: minicloud-postgres-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: minicloud_prod_db
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - minicloud-network
    restart: always

  # 2. Redis Cache (MỚI THÊM - Bắt buộc cho Hangfire)
  redis:
    image: redis:alpine
    container_name: minicloud-redis-prod
    networks:
      - minicloud-network
    restart: always

  # 3. Main Application (.NET API)
  api:
    container_name: minicloud-api-prod
    build:
      context: .
      dockerfile: Dockerfile # <--- Trỏ đúng file Dockerfile ở thư mục gốc
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Kết nối DB dùng tên service "postgres"
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=minicloud_prod_db;Username=postgres;Password=password123
      # Kết nối Redis dùng tên service "redis"
      - ConnectionStrings__RedisConnection=redis:6379
    ports:
      - "5000:8080" # Map ra cổng 5000 để bạn test luôn
    depends_on:
      - postgres
      - redis
    networks:
      - minicloud-network
    restart: always

  # --- TẠM ẨN NGINX (Sẽ bật lại sau khi có config) ---
  # nginx:
  #   container_name: minicloud-nginx
  #   ...

volumes:
  pgdata_prod:

networks:
  minicloud-network: